<!--
  AquaVolt-AI: Wazuh Agent Configuration (ossec.conf)
  Provides real-time File Integrity Monitoring (FIM) and JSON log ingestion.
-->
<ossec_config>
  <client>
    <server>
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu22, ubuntu22.04</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- File Integrity Monitoring (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <auto_ignore>no</auto_ignore>
    <alert_new_files>yes</alert_new_files>

    <!-- Monitor Telemetry Ledgers, Database and Source Code in Realtime -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/app/data</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/app/database</directories>
    <directories check_all="yes" realtime="yes">/app/api</directories>

    <!-- Ignore temporary files -->
    <ignore>/app/data/**/*.tmp</ignore>
    <ignore>/app/__pycache__</ignore>
  </syscheck>

  <!-- JSON Security Log Collector -->
  <localfile>
    <log_format>json</log_format>
    <location>/app/logs/wazuh_security.json</location>
  </localfile>

  <!-- Standard System Auth Logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</ossec_config>
