version: '3.9'

services:
  # Wazuh Single-Node SIEM Manager & Indexer
  wazuh_manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: aquavolt_wazuh_manager
    restart: unless-stopped
    ports:
      - "1514:1514/tcp"
      - "1515:1515/tcp"
      - "514:514/udp"
      - "55000:55000/tcp"
    environment:
      - INDEXER_URL=https://aquavolt_wazuh_indexer:9200
    volumes:
      - ./rules/aquavolt_rules.xml:/var/ossec/etc/rules/aquavolt_rules.xml:ro
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs

  # Wazuh Dashboard Web UI
  wazuh_dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: aquavolt_wazuh_dashboard
    restart: unless-stopped
    ports:
      - "443:5601"
    environment:
      - INDEXER_URL=https://aquavolt_wazuh_indexer:9200
      - WAZUH_API_URL=https://aquavolt_wazuh_manager:55000
    depends_on:
      - wazuh_manager

volumes:
  wazuh_etc:
  wazuh_logs:
