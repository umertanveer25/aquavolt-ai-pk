name: Automated Telemetry Backfill Sync

on:
  schedule:
    # Trigger 4x a day (every 6 hours at minute 0)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual triggers from the GitHub website

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Fetch all history so git commit/push works cleanly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # cache pip dependencies to speed up runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scipy urllib3

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: Run Parallel Backfill Sync
        run: |
          python scratch/backfill_parallel.py
