name: Automated 24/7 Hourly Telemetry Sync

on:
  schedule:
    # Runs at minute 5 of every single hour (24/7)
    - cron: '5 * * * *'
  workflow_dispatch: # Manual 1-click trigger

permissions:
  contents: write

jobs:
  hourly-telemetry-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas numpy urllib3

      - name: Sync Current Hour Telemetry for Pakistan & USA
        run: |
          python api/live_farm_sync.py

      - name: Commit and Push Hourly Telemetry to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff-index --quiet HEAD || (git commit -m "chore(telemetry): automated 24/7 hourly sync for $(date -u +'%Y-%m-%d %H:00:00 UTC')" && git push origin main)
