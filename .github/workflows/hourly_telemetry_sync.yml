name: Automated 24/7 Hourly Telemetry Sync

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hourly-telemetry-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas numpy urllib3 pyarrow fastparquet

      - name: PATH A - Sync Local Farms (USA & Pakistan)
        run: |
          python api/live_farm_sync.py

      - name: Commit and Push Path A (Local CSVs)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(telemetry): local automated sync for 2026-08-25 21:00:00 UTC"
            git pull --rebase origin main || true
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi

      - name: PATH B - Sync Enterprise Shard (65ha RRI)
        env:
          SHARD_GITHUB_TOKEN: ${{ secrets.SHARD_GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${SHARD_GITHUB_TOKEN}@github.com/umertanveer25/aquavolt-rri-26-27.git data_shard || mkdir data_shard
          python api/shard_sync_rri.py
          cd data_shard
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.parquet
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(shard): auto-sync highly compressed telemetry 2026-08-25 21:00:00 UTC"
            git push https://x-access-token:${SHARD_GITHUB_TOKEN}@github.com/umertanveer25/aquavolt-rri-26-27.git HEAD:main
          fi
