name: "Update Graphify Map"
on:
  push:
    branches:
      - main

jobs:
  graphify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Graphify
        run: pip install graphifyy
      - name: Generate Graph
        run: python -m graphify . --code-only
      - name: Commit and Push Graph
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add graphify-out/
          git commit -m "docs: auto-update Graphify architectural map [skip ci]" || echo "No changes to commit"
          git push
