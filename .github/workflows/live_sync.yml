name: AquaVolt Autonomous Live Sync
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: live-sync-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  hourly-telemetry-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy pyarrow requests scikit-learn

      - name: Execute 3-Farm Live Sync
        run: python api/live_farm_sync.py

      - name: Commit and Push Data Updates
        run: |
          git config --global user.name 'AquaVolt-AI-Bot'
          git config --global user.email 'ai-bot@aquavolt.com'
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-sync: Live satellite telemetry ingested"
          git pull --rebase origin main
          git push origin main
